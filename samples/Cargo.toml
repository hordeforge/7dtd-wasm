[workspace]
resolver = "2"
members = [
    "guest-common",
    "guest-hello",
    "guest-fixtures/trap",
    "guest-fixtures/fuel",
    "guest-fixtures/strings",
    "guest-fixtures/bigmem",
    "guest-fixtures/noexports",
]

[workspace.package]
# Every guest crate is a wasm module the host loads as a raw .wasm, never a
# library another project takes from a registry. Without this, `cargo publish`
# offers them and fails on the missing description and license instead, and a
# guest module is not something a crate registry should carry.
publish = false

[workspace.lints.rust]
# Every default-warn rustc lint is a build error in guest crates. The
# tree compiles clean today, so a new diagnostic fails the build
# instead of scrolling by as ignorable noise.
warnings = "deny"

[workspace.lints.clippy]
# Same posture for clippy's default set (correctness, suspicious,
# style, complexity, perf): the tree passes it clean today, so any
# new clippy diagnostic fails samples-check. Pedantic stays off for
# now; it still reports ~14 findings (cast truncation, missing
# backticks, must_use) and enabling it unpassed would break the gate.
all = "deny"

[profile.release]
panic = "abort"
