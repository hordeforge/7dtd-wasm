name: ci

on:
  push:
    branches: [main]
  pull_request:
  # A hosted runner that drops its network or times out is re-run by hand
  # from the Actions tab, on a branch, without pushing an empty commit.
  workflow_dispatch:
  # release.yml calls this workflow so a tag is gated by the same checks a
  # pull request is, instead of shipping a second copy of the steps.
  workflow_call:

# Least privilege: the pipeline only needs to read the code.
permissions:
  contents: read

# One run per ref: a fresh push cancels the superseded in-progress run
# instead of queueing duplicate parallel jobs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions pinned by full commit SHA (tag in comment) so a moved tag or a
      # compromised major-version release cannot inject code into the pipeline.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          # global.json is the machine-readable declaration of the SDK the
          # tree builds against; this is the same 8.0 feature band, spelled
          # out so the runner resolves it without reading the manifest.
          dotnet-version: "8.0.x"
          # Every project restores from a committed, SHA512-hashed
          # packages.lock.json, so the cache key is exact: a package bump
          # misses the cache, an unchanged tree restores from it instead of
          # re-downloading the whole closure. Locked mode still verifies
          # every hash, so a warm cache is a speed win, not a trust one.
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      # The Makefile pins RUSTUP_HOME and CARGO_HOME inside the checkout, so a
      # developer host installs no Rust system-wide. "make toolchain" runs the
      # same two rustup commands CI ran by hand, against that same in-project
      # home, so there is one copy of the guest toolchain steps and a locally
      # built guest comes off the same stable toolchain with the same
      # wasm32-wasip1 target and clippy. The workspace [lints] in
      # samples/Cargo.toml deny every default rustc warning plus clippy's
      # default set, which is what makes samples-check a lint gate.
      - name: Install the guest toolchain into the in-project rustup home
        run: make toolchain
      # Pinned to the same ruff version developers run locally via
      # "ruff check tools" so local and CI never disagree on rule sets. The
      # version comes from pyproject.toml through the Makefile, the one
      # place it is declared, so a bump there cannot leave this step
      # installing a ruff the gate then rejects.
      - name: Install ruff (pinned)
        run: python3 -m pip install --quiet "ruff==$(make ruff-version)"
      # check-ci is the game-free half of check: doccheck, the tools unit
      # tests, the tools lint and format gates, the guest lint gate, the
      # host build,
      # and the host test suite.
      # bridge and bridge-check need a dedicated server install and cannot run
      # on a hosted runner; that half is proven on a developer host.
      - run: make check-ci
