name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the pipeline only needs to read the code.
permissions:
  contents: read

# One run per ref: a fresh push cancels the superseded in-progress run
# instead of queueing duplicate parallel jobs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The Makefile defaults CARGO to the in-project rustup toolchain, which
      # is gitignored and absent here; the runner's own cargo is used instead.
      CARGO: cargo
    steps:
      # Actions pinned by full commit SHA (tag in comment) so a moved tag or a
      # compromised major-version release cannot inject code into the pipeline.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
      # The Makefile pins RUSTUP_HOME and CARGO_HOME inside the checkout, so a
      # developer host installs no Rust system-wide, and those assignments win
      # over the environment. Honour that layout rather than working around
      # it: populate the in-project rustup home using the runner's own rustup,
      # so make sees exactly what it expects. The guests are wasm32-wasip1,
      # and the workspace [lints] in samples/Cargo.toml deny every default
      # rustc warning, which is what makes this compile the guest lint gate.
      - name: Install the guest toolchain into the in-project rustup home
        env:
          RUSTUP_HOME: ${{ github.workspace }}/.rustup
          CARGO_HOME: ${{ github.workspace }}/.cargo
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-wasip1
          rustup default stable
      # check-ci is the game-free half of check: doccheck, the tools unit
      # tests, the guest lint gate, the host build, and the host test suite.
      # bridge and bridge-check need a dedicated server install and cannot run
      # on a hosted runner; that half is proven on a developer host.
      - run: make check-ci
