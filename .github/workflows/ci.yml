name: ci

on:
  push:
    branches: [main]
  pull_request:
  # A hosted runner that drops its network or times out is re-run by hand
  # from the Actions tab, on a branch, without pushing an empty commit.
  workflow_dispatch:
  # release.yml calls this workflow so a tag is gated by the same checks a
  # pull request is, instead of shipping a second copy of the steps.
  workflow_call:

# Least privilege: the pipeline only needs to read the code.
permissions:
  contents: read

# One run per ref: a fresh push cancels the superseded in-progress run
# instead of queueing duplicate parallel jobs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Locale, timezone, and first-run state pinned so a build cannot pick up
    # whatever the runner image happens to default to. C.UTF-8 fixes the
    # collation and the default encoding the Python gates and the SDK read
    # files with; UTC fixes any date the tree formats. The dotnet variables
    # keep the first-run banner, the telemetry notice, and the SDK's
    # first-run extraction under $HOME out of the job. Set per job, not at
    # workflow level: the windows job below has no C.UTF-8 locale to resolve.
    env:
      LC_ALL: C.UTF-8
      TZ: UTC
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
    steps:
      # Actions pinned by full commit SHA (tag in comment) so a moved tag or a
      # compromised major-version release cannot inject code into the pipeline.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          # global.json is the machine-readable declaration of the SDK the
          # tree builds against, so the runner installs what that file pins
          # instead of a version spelled out here. A literal "8.0.x" is a
          # floating toolchain: the newest 8.0 SDK appears in the runner
          # image the day Microsoft ships it, and a build that used to
          # produce one assembly produces a different one with no diff in
          # the tree. Reading the manifest keeps one declaration.
          global-json-file: global.json
          # Every project restores from a committed, SHA512-hashed
          # packages.lock.json, so the cache key is exact: a package bump
          # misses the cache, an unchanged tree restores from it instead of
          # re-downloading the whole closure. Locked mode still verifies
          # every hash, so a warm cache is a speed win, not a trust one.
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      # The guest toolchain is ~350 MB downloaded on every run without this,
      # which is the largest fixed cost in the job. Both caches key on the
      # file that declares the channel, so a channel bump misses them and an
      # unchanged tree restores from them. This is a speed win only: "make
      # toolchain" below is idempotent and re-verifies whatever the cache
      # restored, so a poisoned entry fails the build instead of building
      # guests from it.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # .cargo carries the registry cache the Makefile's CARGO_HOME points
          # at, .rustup the installed channel and the wasm32-wasip1 target.
          path: |
            .cargo
            .rustup
          key: rust-toolchain-${{ hashFiles('samples/rust-toolchain.toml') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # The guest build output. Keyed on the lock file as well as the
          # channel, so a dependency bump recompiles instead of reusing
          # artifacts cargo would rebuild anyway.
          path: samples/target
          key: wasm32-wasip1-${{ hashFiles('samples/rust-toolchain.toml', 'samples/Cargo.lock') }}
      # The Makefile pins RUSTUP_HOME and CARGO_HOME inside the checkout, so a
      # developer host installs no Rust system-wide. "make toolchain" runs the
      # same two rustup commands CI ran by hand, against that same in-project
      # home, so there is one copy of the guest toolchain steps and a locally
      # built guest comes off the same stable toolchain with the same
      # wasm32-wasip1 target and clippy. The workspace [lints] in
      # samples/Cargo.toml deny every default rustc warning plus clippy's
      # default set, which is what makes samples-check a lint gate.
      - name: Install the guest toolchain into the in-project rustup home
        run: make toolchain
      # Pinned to the same ruff version developers run locally via
      # "ruff check tools" so local and CI never disagree on rule sets. The
      # version comes from pyproject.toml through the Makefile, the one
      # place it is declared, so a bump there cannot leave this step
      # installing a ruff the gate then rejects. --no-deps keeps the runner
      # from resolving anything beside the one wheel (ruff ships no runtime
      # dependencies), and --only-binary refuses a source distribution,
      # which would build the linter from a fetched sdist here.
      - name: Install ruff (pinned)
        # Quoted because the bare form carries a ": " free but colon-dense
        # argument (--only-binary=:all:), which stricter YAML readers reject
        # as a mapping inside a plain scalar.
        run: 'python3 -m pip install --quiet --no-deps --only-binary=:all: "ruff==$(make ruff-version)"'
      - name: Make sure shellcheck is on PATH
        # check-ci lints the bash under evidence/ with shellcheck, and the
        # ubuntu runner image ships it. This step only matters if a future
        # image stops shipping it: without it the gate inside check-ci would
        # fail on a missing tool rather than on a defective script.
        run: |
          command -v shellcheck >/dev/null \
            || sudo apt-get install -y --no-install-recommends shellcheck
      # check-ci is the game-free half of check: doccheck, the tools unit
      # tests, the tools lint and format gates, the shell lint gate, the
      # guest lint gate, the host build, and the host test suite.
      # bridge and bridge-check need a dedicated server install and cannot run
      # on a hosted runner; that half is proven on a developer host.
      - run: make check-ci

  # The host library is the artifact a Windows server actually loads: the
  # net48 bridge runs inside the game process, and the .wasm guests it drives
  # are platform-neutral, so every filesystem, case-comparison, and encoding
  # decision in HordeForge.WasmHost is a decision about the filesystem of a
  # Windows install. Linux-only CI never exercised any of them, which is how
  # a mod id naming a Windows device stayed valid in the validator while
  # naming no directory on the platform the mod runs on.
  #
  # This job runs the host build and its test suite only, and calls dotnet
  # rather than make: the windows runner image has no GNU make, and the
  # Makefile targets that need one (make dist, make bridge) are the ones
  # README records as unproven on Windows. What this covers is the shipped
  # library and the module-loading path, on the platform it is loaded on.
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          # The same manifest-pinned SDK the linux job installs, so the
          # two platforms compile the library with one toolchain.
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      # No -p:RestoreLockedMode here: Directory.Build.props turns it on
      # wherever CI=true, so the two steps below restore from the committed
      # lock files and one declaration covers every restore a pipeline runs,
      # including the ones that never read the Makefile.
      - name: Build the host library
        run: dotnet build src/HordeForge.WasmHost/HordeForge.WasmHost.csproj -c Release
      - name: Run the host test suite
        run: dotnet test tests/HordeForge.WasmHost.Tests -c Release
