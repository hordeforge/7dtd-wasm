name: release

# Tag-driven releases (hordeforge/.github REPOSITORY_STANDARDS.md, §8): a
# vX.Y.Z tag must agree with the version this repository actually ships, so a
# mistyped or forgotten bump is rejected instead of becoming a release nobody
# can reproduce. The version lives in three places (the game modlet manifest,
# the publishable library manifest, and the newest released changelog
# section); all three are checked here, and tools/versioncheck.py enforces
# the same agreement on every "make check" so drift cannot accumulate
# between tags.
#
# The mod archive is deliberately NOT built here. `make dist` compiles
# against the dedicated server's own assemblies, which a hosted runner does
# not have; a maintainer with a game install runs `make dist` and attaches
# dist/Mods. Gating the tag is the half that can be proven automatically, and
# asserting the other half here would be a claim, not evidence.
#
# The tag is not taken on trust: this workflow first runs ci.yml (the same
# docs, lint, guest, build, and test gate that guards pull requests), so a tag
# can never ship a tree that main has not already proved.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One run per tag: a re-pushed or force-moved tag supersedes the in-flight
# run instead of queueing a second one against the same ref.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A tag is a release, and a release must not be cut from a tree that does
  # not pass the same gate a pull request does. This calls ci.yml rather than
  # repeating its steps, so the two can never drift apart.
  check:
    uses: ./.github/workflows/ci.yml

  verify-tag:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Actions pinned by full commit SHA (tag in comment) so a moved tag or a
      # compromised major-version release cannot inject code into the pipeline.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The same gate "make check" runs, with --tag added: the three
      # declarations must agree with each other and with the tag. It is the
      # tool, not a second copy of its parsing here, so the two gates cannot
      # drift apart.
      - name: Check the tag matches every shipped version declaration
        run: python3 tools/versioncheck.py --tag "${GITHUB_REF_NAME}"
