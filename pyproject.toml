# Ruff gate for the Python tooling under tools/. Run via
# "make check-ci" (which fails loudly when a rule fires); CI installs
# the same pinned version, so local and remote never disagree.
#
# required-version is the machine-readable half of that promise: a developer
# on a different ruff gets a named error from ruff itself instead of a rule
# set that quietly differs from CI's. It is the one version declaration here,
# so bumping it is also bumping what ci.yml installs.
#
# Rule groups are enabled only where the tree already passes them:
# PL (pylint) still has findings (module-global counters in
# doccheck.py), PT assumes pytest conventions while these tests run
# under unittest, and T20 flags the print() these CLI tools report
# with, so those three stay off until their findings are fixed. COM is
# left out because COM812 fights the formatter, which owns trailing
# commas here. TRY is on with TRY003 off: that one rule is a style
# preference about message length in raise(), and it has 20 findings
# here, while the rest of the group (TRY200/201/300/301/400/401,
# the raise-from and control-flow-in-try rules) is clean and catches
# real defects. ANN is the biggest group still off (no annotations
# on the tools), and it stays off until the tree is annotated.
#
# "ruff format" is the formatter (the pinned ruff ships it, so there is
# no second tool to version) and "make check-ci" runs it in check mode.
[tool.ruff]
line-length = 100
target-version = "py311"
required-version = "==0.16.4"
src = ["tools"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E4",   # pycodestyle errors (imports)
    "E501", # hard line-length cap at 100 columns
    "E7",   # pycodestyle: statement-level issues
    "E9",   # pycodestyle: runtime/syntax errors
    "F",    # pyflakes: real defects
    "B",    # flake8-bugbear: bug-prone patterns
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade: keep to the declared floor (3.11)
    "I",    # import sorting
    "W",    # pycodestyle warnings
    "C4",   # flake8-comprehensions
    "RET",  # flake8-return
    "ARG",  # unused arguments
    "ERA",  # commented-out code
    "PTH",  # use pathlib over os functions
    "RUF",  # ruff-specific rules
    "S",    # bandit: insecure calls and hardcoded credentials
    "A",    # flake8-builtins: shadowing a builtin is a defect
    "BLE",  # blind except: an exception must not vanish
    "DTZ",  # naive datetimes (these tools are all UTC by construction)
    "FBT",  # boolean positional args hide a call's meaning
    "FURB", # refur: a better rewrite of the same code
    "G",    # logging format checks
    "ICN",  # import aliases: conventional names only
    "ISC",  # implicit string concatenation traps
    "LOG",  # logging misuse
    "N",    # pep8-naming
    "PERF", # per-call performance traps
    "PIE",  # misc lints
    "SLF",  # private member access across boundaries
    "TID",  # tidy imports: no banned modules
    "RSE",  # flake8-raise: nothing is raised inside a pointless wrapper
    "TRY",  # tryceratops: control flow and raise-from inside try
]
# TRY003 hoists an exception message into a named constant. These are CLI
# tools whose raise() sites carry a short inline message, and a constant
# would name less than the sentence does. Every other TRY rule runs.
ignore = ["TRY003"]
